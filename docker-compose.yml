services:
  mpd:
    image: gists/mpd
    container_name: mpd
    ports:
      - "6600:6600"
      - "8000:8000"
    environment:
      PULSE_SERVER: "unix:/run/user/100/pulse/native"
    volumes:
      - "/run/user/$UID/pulse:/run/user/100/pulse"
      - "./mpd-data/mpd.conf:/etc/mpd.conf"
      - "./mpd-data/music:/music"
      - "./mpd-data/playlists:/var/lib/mpd/playlists"
    command: [ "sh", "-c", "chown 100:100 /run/user/100/* 2>/dev/null || true; mpd --stdout --no-daemon" ]
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flet-music-player
    environment:
      HOST: "0.0.0.0"
      PORT: "7080"
      MPD_HOST: "mpd"
      MPD_PORT: "6600"
    depends_on:
      - mpd
    ports:
      - "7080:7080"
    restart: unless-stopped
